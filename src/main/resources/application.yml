server:
  port: 8080

spring:
  application:
    name: books-authors
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/booksdb}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  ingest:
    default-path: ${INGEST_CSV_PATH:data/books_1.Best_Books_Ever.csv}
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:60}

# Рівні логування змінюються без перекомпіляції:
#   APP_LOG_LEVEL=DEBUG  — деталі для розробника (час відповіді БД, bulk-запити)
#   APP_LOG_LEVEL=INFO   — корисна статистика (за замовчуванням)
#   APP_LOG_LEVEL=WARN / ERROR — лише проблеми
logging:
  file:
    name: ${LOG_FILE:logs/app.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
  level:
    root: INFO
    com.booksauthors: ${APP_LOG_LEVEL:INFO}
    org.mongodb.driver: WARN
